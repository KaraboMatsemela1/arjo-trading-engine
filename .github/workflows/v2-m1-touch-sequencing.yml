name: V2 M1 Touch Sequencing

on:
  pull_request:
    paths:
      - research/v2/v2_m1_touch_sequencing_v1.json
      - scripts/v2_m1_execution_measurement.py
      - scripts/test_v2_m1_execution_measurement.py
      - scripts/run_v2_m1_measurement_development.py
      - .github/workflows/v2-m1-touch-sequencing.yml
  push:
    branches:
      - v2/issue-198-m1-touch-sequencing
    paths:
      - research/v2/v2_m1_touch_sequencing_v1.json
      - scripts/v2_m1_execution_measurement.py
      - scripts/test_v2_m1_execution_measurement.py
      - scripts/run_v2_m1_measurement_development.py
      - .github/workflows/v2-m1-touch-sequencing.yml

permissions:
  contents: read
  actions: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile M1 measurement tooling
        run: python -m py_compile scripts/v2_m1_execution_measurement.py scripts/test_v2_m1_execution_measurement.py scripts/run_v2_m1_measurement_development.py
      - name: Run fail-closed sequencing tests
        run: PYTHONPATH=scripts python scripts/test_v2_m1_execution_measurement.py
      - name: Validate frozen measurement policy SHA
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from v2_m1_execution_measurement import load_policy
          p = load_policy(Path('research/v2/v2_m1_touch_sequencing_v1.json'))
          assert p['policy_sha256'] == '6de757b7957a48c85b72e215c986defee5aebca4e317f3f839b04b47cdf064d6'
          print('m1_measurement_policy=PASS')
          PY

  developmental-regression:
    if: github.event_name == 'push'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download sealed development occurrence set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arjo-calibration-occurrences-owner-operational-v1
          path: /tmp/arjo-occurrences
          github-token: ${{ github.token }}
          repository: KaraboMatsemela1/arjo-trading-engine
          run-id: 32022634834
      - name: Download sealed 2024 M1 development data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arjo-oanda-nas100-calibration-2024
          path: /tmp/arjo-2024
          github-token: ${{ github.token }}
          repository: KaraboMatsemela1/arjo-trading-engine
          run-id: 32014398864
      - name: Reproduce M1 entry and outcome sequence
        run: >-
          PYTHONPATH=scripts python scripts/run_v2_m1_measurement_development.py
          --occurrences /tmp/arjo-occurrences/calibration-occurrences.json
          --m1 /tmp/arjo-2024/NAS100_USD.M1.jsonl
          --output /tmp/m1-measurement/developmental-m1-measurement.json
      - name: Verify developmental sequence and boundaries
        run: |
          python - <<'PY'
          import json
          p='/tmp/m1-measurement/developmental-m1-measurement.json'
          r=json.load(open(p))
          m=r['measurement']
          assert r['occurrence_id'] == 'OWNER-CAL-2024-04-26'
          assert m['entry_ts'] == '2024-04-26T14:30:00Z'
          assert m['execution_outcome'] == 'STOP_FIRST'
          assert m['event_ts'] == '2024-04-30T15:13:00Z'
          assert r['holdout_2026h1_accessed'] is False
          assert r['future_validation_data_accessed'] is False
          assert r['performance_comparison_performed'] is False
          print('developmental_m1_sequence=PASS')
          PY
      - name: Upload sealed developmental measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arjo-v2-m1-measurement-development
          path: /tmp/m1-measurement
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
