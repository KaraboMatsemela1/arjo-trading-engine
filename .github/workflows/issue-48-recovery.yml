name: Issue 48 First-Party Recovery

on:
  workflow_dispatch:
  push:
    branches: [issue-48-aoo-first-party-recovery]
    paths:
      - 'research/recovery/issue_48_targets.csv'
      - 'scripts/build_issue48_recovery_windows.py'
      - 'scripts/build_issue48_telegram_archive_recovery.py'
      - '.github/workflows/issue-48-recovery.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public-source acquisition helper
        run: python -m pip install --disable-pip-version-check yt-dlp==2026.6.9
      - name: Compile recovery tooling
        run: python -m compileall -q scripts
      - name: Acquire only bounded Issue 48 first-party targets
        run: >-
          python scripts/acquire_corpus.py
          --registry research/recovery/issue_48_targets.csv
          --manifest /tmp/issue48_acquisition_manifest.jsonl
          --cache-root /tmp/issue48-cache
          --replace-manifest
          --timeout 120
      - name: Validate terminal recovery acquisition records
        run: >-
          python scripts/check_acquisition_manifest.py
          --registry research/recovery/issue_48_targets.csv
          --manifest /tmp/issue48_acquisition_manifest.jsonl
      - name: Build bounded lexical recovery windows from direct target payloads
        run: >-
          python scripts/build_issue48_recovery_windows.py
          --manifest /tmp/issue48_acquisition_manifest.jsonl
          --cache-root /tmp/issue48-cache
          --output /tmp/issue48_recovery_windows.json
          --max-words 20
          --max-windows-per-source 12
      - name: Build archive-level recovery windows from canonical captured Telegram corpus
        run: >-
          python scripts/build_issue48_telegram_archive_recovery.py
          --acquisition research/acquisition_manifest.jsonl
          --output /tmp/issue48_telegram_archive_recovery.json
          --max-words 20
          --max-excerpts-per-message 12
      - name: Upload bounded recovery evidence locator artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-48-first-party-recovery
          path: |
            /tmp/issue48_acquisition_manifest.jsonl
            /tmp/issue48_recovery_windows.json
            /tmp/issue48_telegram_archive_recovery.json
          retention-days: 14
