name: Final Project State Governance

on:
  pull_request:
    paths:
      - scripts/project_state_final.py
      - scripts/test_project_state_final.py
      - .github/workflows/project-state.yml
      - .github/workflows/final-project-state-governance.yml
      - README.md
      - ROADMAP.md
      - FINAL_DISPOSITION.md
  push:
    branches:
      - governance/issue-208-project-closure-v2
    paths:
      - scripts/project_state_final.py
      - scripts/test_project_state_final.py
      - .github/workflows/project-state.yml
      - .github/workflows/final-project-state-governance.yml
      - README.md
      - ROADMAP.md
      - FINAL_DISPOSITION.md

permissions:
  contents: read

jobs:
  final-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile final project-state wrapper
        run: python -m py_compile scripts/project_state.py scripts/project_state_final.py scripts/test_project_state_final.py
      - name: Verify terminal existing-evidence closure
        run: PYTHONPATH=scripts python scripts/test_project_state_final.py
      - name: Verify wrapped-project claims
        run: |
          grep -q 'Future untouched validation is preserved as an optional scientific follow-up' FINAL_DISPOSITION.md
          grep -q 'does \*\*not\*\* mean the strategy has been proven profitable' FINAL_DISPOSITION.md
          grep -q 'V2_FUTURE_VALIDATION_COMPLETE.*DEFERRED / NOT ASSERTED' README.md
          grep -q 'No further work is required for the current project wrap' ROADMAP.md
          grep -q 'Paper execution.*false' README.md
          grep -q 'Live execution.*false' README.md
          ! grep -q 'only substantive unfinished task' README.md
          ! grep -q 'only unfinished project gate' ROADMAP.md
