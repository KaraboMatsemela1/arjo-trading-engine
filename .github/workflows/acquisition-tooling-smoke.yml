name: Acquisition Tooling Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/acquire_corpus.py'
      - 'scripts/acquisition_*.py'
      - 'scripts/check_acquisition_manifest.py'
      - '.github/workflows/acquisition-tooling-smoke.yml'

permissions:
  contents: read

jobs:
  acquire-first-party-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition transport
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Attempt one registered YouTube video
        run: >-
          python scripts/acquire_corpus.py
          --source-type YOUTUBE_VIDEO
          --limit 1
          --manifest /tmp/acquisition_manifest.jsonl
          --cache-root /tmp/arjo-artifacts
      - name: Acquire one public Telegram post
        run: >-
          python scripts/acquire_corpus.py
          --source-id TG_ARJOIOTRADING_1
          --manifest /tmp/acquisition_manifest.jsonl
          --cache-root /tmp/arjo-artifacts
      - name: Validate terminal manifest
        run: >-
          python scripts/check_acquisition_manifest.py
          --manifest /tmp/acquisition_manifest.jsonl
      - name: Validate capture and access semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(line) for line in Path('/tmp/acquisition_manifest.jsonl').read_text().splitlines() if line.strip()]
          if len(records) != 2:
              raise SystemExit(f'expected two records, got {len(records)}')
          telegram = next((r for r in records if r['source_id'] == 'TG_ARJOIOTRADING_1'), None)
          youtube = next((r for r in records if r['source_type'] == 'YOUTUBE_VIDEO'), None)
          if telegram is None or telegram['status'] != 'PAYLOAD_CAPTURED':
              raise SystemExit(f'Telegram direct payload was not captured: {telegram}')
          if not telegram['first_party_contacted'] or not telegram['sha256']:
              raise SystemExit('Telegram capture lacks direct contact or SHA-256 provenance')
          if telegram['closure_credit'] != 'DIRECT_FIRST_PARTY_PAYLOAD':
              raise SystemExit('Telegram capture lacks direct first-party closure credit')
          if youtube is None or youtube['status'] not in {'PAYLOAD_CAPTURED', 'ENVIRONMENT_ACCESS_FAILURE'}:
              raise SystemExit(f'YouTube attempt has unexpected terminal state: {youtube}')
          if not youtube['first_party_contacted']:
              raise SystemExit('YouTube attempt did not contact first-party infrastructure')
          if youtube['status'] == 'ENVIRONMENT_ACCESS_FAILURE':
              if youtube['sha256'] or youtube['closure_credit'] != 'ZERO_NO_PAYLOAD':
                  raise SystemExit('YouTube access failure incorrectly claims payload/closure credit')
          elif not youtube['sha256'] or youtube['closure_credit'] != 'DIRECT_FIRST_PARTY_PAYLOAD':
              raise SystemExit('YouTube capture lacks SHA/direct closure credit')
          if any(record['semantic_extraction_performed'] for record in records):
              raise SystemExit('acquisition smoke performed semantic extraction')
          print({r['source_id']: {'status': r['status'], 'sha256': r['sha256']} for r in records})
          PY
      - name: Upload bounded manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-tooling-smoke
          path: /tmp/acquisition_manifest.jsonl
          retention-days: 7
