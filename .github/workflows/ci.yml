name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile deterministic Python scripts
        run: python -m compileall -q scripts
      - name: Run acquisition tooling smoke test
        run: python scripts/test_acquisition_tooling.py
      - name: Run corpus acquisition orchestration tests
        run: python scripts/test_corpus_acquisition.py
      - name: Run atomic evidence extraction smoke test
        run: python scripts/test_evidence_registry.py
      - name: Run independent SPEC audit regression tests
        run: python scripts/test_independent_spec_audit.py
      - name: Run Issue 48 recovery regression tests
        run: python scripts/test_issue48_recovery.py
      - name: Run SPEC audit service-issue publication regression tests
        run: python scripts/test_spec_audit_service_issue.py
      - name: Run discovery watch publication-decision tests
        run: python scripts/test_discovery_watch_state.py
      - name: Run autonomous research handoff contract tests
        run: python scripts/test_autonomous_research_handoff.py
      - name: Validate acquisition manifest
        run: python scripts/check_acquisition_manifest.py
      - name: Validate concept inventory provenance
        run: python scripts/check_concept_inventory.py
      - name: Validate generated evidence registry union when present
        shell: bash
        run: |
          if [ -s research/evidence_registry.jsonl ] && [ -f research/evidence_coverage.json ]; then
            python scripts/check_evidence_registry.py
          else
            echo "Evidence registry not generated yet; post-merge extraction gate remains pending."
          fi
      - name: Build Phase 5 predicate matrix and closure state
        run: >-
          python scripts/build_predicate_matrix.py
          --matrix /tmp/predicate_matrix.csv
          --closure /tmp/predicate_closure.json
      - name: Validate Phase 5 predicate matrix and closure state
        run: >-
          python scripts/check_predicate_matrix.py
          --matrix /tmp/predicate_matrix.csv
          --closure /tmp/predicate_closure.json
      - name: Run two-code-path reconstruction preflight
        run: >-
          python scripts/two_engineer_preflight.py
          --matrix /tmp/predicate_matrix.csv
          --output /tmp/two_engineer_preflight.json
      - name: Build bounded recovery task plan
        run: >-
          python scripts/build_recovery_tasks.py
          --closure /tmp/predicate_closure.json
          --output /tmp/predicate_recovery_tasks.json
          --active-limit 2
      - name: Build candidate omission audit
        run: >-
          python scripts/build_candidate_selection_audit.py
          --output /tmp/candidate_selection_audit.json
      - name: Validate candidate omission dispositions when present
        shell: bash
        run: |
          if [ -f research/candidate_selection_dispositions.json ]; then
            python scripts/check_candidate_selection_dispositions.py \
              --audit /tmp/candidate_selection_audit.json \
              --dispositions research/candidate_selection_dispositions.json
          else
            echo "Candidate omission dispositions not committed yet; Phase 5 gate remains pending."
          fi
      - name: Run independent evidence-only SPEC readiness audit against regenerated state
        run: >-
          python scripts/run_independent_spec_audit.py
          --matrix /tmp/predicate_matrix.csv
          --preflight /tmp/two_engineer_preflight.json
          --recovery /tmp/predicate_recovery_tasks.json
          --output /tmp/SPEC_AUDIT.json
      - name: Validate independent SPEC audit invariants against regenerated state
        run: >-
          python scripts/check_independent_spec_audit.py
          --audit /tmp/SPEC_AUDIT.json
          --matrix /tmp/predicate_matrix.csv
          --recovery /tmp/predicate_recovery_tasks.json
      - name: Generate canonical project state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/project_state.py
          --output /tmp/project_state.json
          --status-output /tmp/STATUS.md
      - name: Validate dependencies
        run: python scripts/check_dependencies.py --state /tmp/project_state.json
      - name: Validate claims
        run: python scripts/check_claims.py --state /tmp/project_state.json
      - name: Validate gate integrity
        run: python scripts/check_gate_integrity.py --state /tmp/project_state.json
      - name: Validate provenance
        run: python scripts/check_provenance.py
      - name: Validate SPEC_READY audit boundary
        run: python scripts/check_spec_gate.py --state /tmp/project_state.json
