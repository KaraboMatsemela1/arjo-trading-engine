name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile deterministic Python scripts
        run: python -m compileall -q scripts
      - name: Run acquisition tooling smoke test
        run: python scripts/test_acquisition_tooling.py
      - name: Run corpus acquisition orchestration tests
        run: python scripts/test_corpus_acquisition.py
      - name: Run atomic evidence extraction smoke test
        run: python scripts/test_evidence_registry.py
      - name: Validate acquisition manifest
        run: python scripts/check_acquisition_manifest.py
      - name: Validate concept inventory provenance
        run: python scripts/check_concept_inventory.py
      - name: Validate generated evidence registry when present
        shell: bash
        run: |
          if [ -s research/evidence_registry.jsonl ] && [ -f research/evidence_coverage.json ]; then
            python scripts/check_evidence_registry.py
          else
            echo "Evidence registry not generated yet; post-merge extraction gate remains pending."
          fi
      - name: Generate canonical project state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/project_state.py
          --output /tmp/project_state.json
          --status-output /tmp/STATUS.md
      - name: Validate dependencies
        run: python scripts/check_dependencies.py --state /tmp/project_state.json
      - name: Validate claims
        run: python scripts/check_claims.py --state /tmp/project_state.json
      - name: Validate gate integrity
        run: python scripts/check_gate_integrity.py --state /tmp/project_state.json
      - name: Validate provenance
        run: python scripts/check_provenance.py
      - name: Validate SPEC_READY audit boundary
        run: python scripts/check_spec_gate.py --state /tmp/project_state.json
