name: Owner Operational Context

on:
  pull_request:
    paths:
      - '.github/workflows/owner-operational-context.yml'
      - 'scripts/build_owner_operational_context_occurrences.py'
      - 'scripts/test_owner_operational_context_occurrences.py'
      - 'research/calibration/owner_operational_context_v1.json'
  push:
    branches:
      - calibration/issue-167-owner-context-v1
    paths:
      - '.github/workflows/owner-operational-context.yml'
      - 'scripts/build_owner_operational_context_occurrences.py'
      - 'scripts/test_owner_operational_context_occurrences.py'
      - 'research/calibration/owner_operational_context_v1.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  convention-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile owner context scripts
        run: python -m py_compile scripts/build_owner_operational_context_occurrences.py scripts/test_owner_operational_context_occurrences.py
      - name: Run frozen convention tests
        run: python scripts/test_owner_operational_context_occurrences.py

  real-frozen-occurrences:
    if: github.event_name == 'push'
    needs: convention-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download sealed annual calibration artifacts
        run: |
          for pair in "2024:9282976276" "2025:9283007527"; do
            YEAR="${pair%%:*}"
            ARTIFACT_ID="${pair##*:}"
            mkdir -p "/tmp/arjo-${YEAR}"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "/tmp/arjo-${YEAR}.zip"
            unzip -q "/tmp/arjo-${YEAR}.zip" -d "/tmp/arjo-${YEAR}"
          done
      - name: Materialize frozen operational occurrence set
        run: >-
          python scripts/build_owner_operational_context_occurrences.py
          --context-convention research/calibration/owner_operational_context_v1.json
          --fvg-convention research/calibration/owner_operational_fvg_v1.json
          --artifact-dir /tmp/arjo-2024
          --artifact-dir /tmp/arjo-2025
          --output /tmp/calibration-occurrences.json
      - name: Verify pre-outcome qualification funnel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('/tmp/calibration-occurrences.json').read_text())
          assert m['status'] == 'CALIBRATION_OCCURRENCES_READY'
          assert m['classification'] == 'OWNER_OPERATIONAL_CONVENTION_NOT_ARJO_SEMANTIC_CLOSURE'
          assert m['semantic_closure_claimed'] is False
          assert m['context_convention_sha256'] == 'dba7892337e391ba6673de5b9df932a271c3af28103e10cecaa0163a9995bc5e'
          assert m['fvg_convention_sha256'] == 'cf12a1ce30d35dced52ef4f3c9bbb3ed11ab6509d6ada33e2f04089c68fafe7e'
          assert m['fvg_session_anchors_sha256'] == '5277a36e777cdac36aa4f27b42435257c6ecd46a1a7c8bf852f1bc9e4f908166'
          assert m['session_count'] == 515
          assert m['qualified_occurrence_count'] == 1
          assert m['status_counts'] == {
              'NO_2CR_REJECTION': 59,
              'NO_2_STING': 14,
              'NO_FVA_OVERLAP': 413,
              'NO_FVG': 2,
              'NO_RUN': 26,
              'QUALIFIED': 1,
          }
          assert m['outcome_fields_present'] is False
          assert m['post_woo_bars_used'] is False
          assert m['holdout_accessed'] is False
          assert m['performance_comparison_performed'] is False
          print('owner_operational_context_real=PASS')
          print('qualification_rows_sha256=' + m['qualification_rows_sha256'])
          print('occurrence_set_sha256=' + m['occurrence_set_sha256'])
          print('occurrence_id=' + m['occurrences'][0]['occurrence_id'])
          PY
      - name: Upload frozen pre-outcome occurrence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arjo-calibration-occurrences-owner-operational-v1
          path: /tmp/calibration-occurrences.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Delete runner-local provider payloads
        if: always()
        run: rm -rf /tmp/arjo-2024 /tmp/arjo-2025 /tmp/arjo-2024.zip /tmp/arjo-2025.zip
