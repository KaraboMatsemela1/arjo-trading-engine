name: V3-C Arguments Trigger Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - validation/issue-227-v3c-arguments-trigger
    paths:
      - 'research/profitability/v3c_arguments_trigger_candidate.json'
      - 'scripts/scan_v3c_arguments_trigger_coverage.py'
      - 'scripts/test_v3c_arguments_trigger_coverage.py'
      - '.github/workflows/v3c-arguments-trigger-coverage.yml'

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preregistration and anti-outcome boundary
        run: python scripts/test_v3c_arguments_trigger_coverage.py
      - name: Download sealed 2024-2025 development artifacts
        run: |
          for pair in "2024:9282976276" "2025:9283007527"; do
            YEAR="${pair%%:*}"; ARTIFACT_ID="${pair##*:}"
            mkdir -p "/tmp/arjo-${YEAR}"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "/tmp/arjo-${YEAR}.zip"
            unzip -q "/tmp/arjo-${YEAR}.zip" -d "/tmp/arjo-${YEAR}"
          done
      - name: Run exact dual-path trigger coverage scan
        run: >-
          python scripts/scan_v3c_arguments_trigger_coverage.py
          --candidate research/profitability/v3c_arguments_trigger_candidate.json
          --artifact-dir /tmp/arjo-2024
          --artifact-dir /tmp/arjo-2025
          --output /tmp/v3c-trigger-coverage.json
      - name: Prove trigger-only boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v3c-trigger-coverage.json'))
          assert r['dual_path_exact_match'] is True
          assert r['post_trigger_price_traversal_accessed'] is False
          assert r['entry_stop_target_defined'] is False
          assert r['performance_metrics_accessed'] is False
          assert r['backward_oos_outcomes_accessed'] is False
          assert r['paper_execution_authorized'] is False
          assert r['live_execution_authorized'] is False
          assert r['broker_mutation_authorized'] is False
          print('swings=' + str(r['h4_swing_high_count']))
          print('triggers=' + str(r['trigger_count']))
          print('unique_dates=' + str(r['unique_activation_dates']))
          print('coverage_feasible=' + str(r['coverage_feasible']))
          print('report_sha256=' + r['report_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3c-arguments-trigger-coverage
          path: /tmp/v3c-trigger-coverage.json
          if-no-files-found: error
          retention-days: 90
      - name: Delete runner-local development payloads
        if: always()
        run: rm -rf /tmp/arjo-2024 /tmp/arjo-2025 /tmp/arjo-2024.zip /tmp/arjo-2025.zip
