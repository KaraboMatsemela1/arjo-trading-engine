name: Project State

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  issues: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/project_state.py
          --output generated/project_state.json
          --status-output generated/STATUS.md

      - uses: actions/upload-artifact@v4
        with:
          name: project-state
          path: generated/

      - name: Stage durable root state
        run: |
          cp generated/project_state.json project_state.json
          cp generated/STATUS.md STATUS.md

      - name: Publish bounded project-state branch when changed
        id: publish
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [ -z "$(git status --porcelain -- project_state.json STATUS.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Project state already matches generated output."
            exit 0
          fi

          branch="automation/project-state-${GITHUB_RUN_ID}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add project_state.json STATUS.md
          git commit -m "governance: persist generated project state"
          git push origin "$branch"

          echo "Published bounded project-state branch: $branch"

      - name: Report publication result
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "Generated project state differs from main."
            echo "Service branch: $BRANCH"
            echo "Open a normal reviewed PR to main; this workflow does not create or merge pull requests."
          else
            echo "No durable project-state update required."
          fi
