name: Project State

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: project-state-publication
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/project_state.py
          --output generated/project_state.json
          --status-output generated/STATUS.md

      - uses: actions/upload-artifact@v4
        with:
          name: project-state
          path: generated/

      - name: Stage durable root state
        run: |
          cp generated/project_state.json project_state.json
          cp generated/STATUS.md STATUS.md

      - name: Publish coalesced project-state branch when changed
        id: publish
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [ -z "$(git status --porcelain -- project_state.json STATUS.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Project state already matches generated output."
            exit 0
          fi

          branch="automation/project-state-current"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add project_state.json STATUS.md
          git commit -m "governance: persist generated project state"
          git push --force-with-lease origin "$branch"

          echo "Published coalesced project-state branch: $branch"

      - name: Open or refresh reviewed Project State PR
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ARJO_AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          existing="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing Project State PR #$existing via stable branch $BRANCH."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Governance: persist generated Project State" \
            --body "Mechanically generated project_state.json and STATUS.md from canonical GitHub issue metadata. This PR is reviewed-only: no workflow self-merge, no semantic research changes, and no strategy execution changes. Merge only after normal CI, dependency, claim, provenance, and gate checks pass."

      - name: Report publication result
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "Generated project state differs from main."
            echo "Coalesced service branch: $BRANCH"
            echo "A normal reviewed PR is open or refreshed for the latest generated state."
          else
            echo "No durable project-state update required."
          fi
