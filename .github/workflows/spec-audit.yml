name: SPEC Audit

on:
  pull_request:
    paths:
      - 'research/evidence_registry.jsonl'
      - 'research/predicate_matrix.csv'
      - 'research/two_engineer_preflight.json'
      - 'research/predicate_recovery_tasks.json'
      - 'docs/spec/**'
      - 'scripts/check_spec_gate.py'
      - 'scripts/run_independent_spec_audit.py'
      - 'scripts/check_independent_spec_audit.py'
      - '.github/workflows/spec-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  spec-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/project_state.py --output /tmp/project_state.json --status-output /tmp/STATUS.md
      - name: Validate repository provenance
        run: python scripts/check_provenance.py
      - name: Validate global SPEC gate boundary
        run: python scripts/check_spec_gate.py --state /tmp/project_state.json
      - name: Run independent evidence-only reconstruction audit
        run: >-
          python scripts/run_independent_spec_audit.py
          --output /tmp/SPEC_AUDIT.json
      - name: Validate independent audit artifact
        run: >-
          python scripts/check_independent_spec_audit.py
          --audit /tmp/SPEC_AUDIT.json
          --matrix research/predicate_matrix.csv
      - name: Upload independent audit review artifact
        uses: actions/upload-artifact@v4
        with:
          name: independent-spec-audit-review
          path: /tmp/SPEC_AUDIT.json
          retention-days: 14
