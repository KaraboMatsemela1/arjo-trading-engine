name: Scheduled Source Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_youtube_sources.py'
      - 'scripts/discover_telegram_sources.py'
      - 'scripts/discover_website_sources.py'
      - 'scripts/build_surface_audit.py'
      - 'scripts/sync_source_roots.py'
      - 'research/source_roots.json'
      - '.github/workflows/scheduled-source-discovery.yml'
  schedule:
    - cron: '23 5 * * 0'

permissions:
  contents: read

jobs:
  discovery-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery tooling
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Synchronize verified discovery roots
        run: python scripts/sync_source_roots.py

      - name: Enumerate official YouTube surfaces
        id: youtube
        shell: bash
        run: |
          set +e
          python scripts/discover_youtube_sources.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enumerate public Telegram archive
        id: telegram
        shell: bash
        run: |
          set +e
          python scripts/discover_telegram_sources.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Crawl first-party website surfaces
        id: website
        shell: bash
        run: |
          set +e
          python scripts/discover_website_sources.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build platform surface audit
        run: python scripts/build_surface_audit.py

      - name: Validate provenance shape
        run: python scripts/check_provenance.py

      - name: Summarize discovery health
        env:
          YOUTUBE_RC: ${{ steps.youtube.outputs.exit_code }}
          TELEGRAM_RC: ${{ steps.telegram.outputs.exit_code }}
          WEBSITE_RC: ${{ steps.website.outputs.exit_code }}
        run: |
          echo "YouTube exit code: $YOUTUBE_RC"
          echo "Telegram exit code: $TELEGRAM_RC"
          echo "Website exit code: $WEBSITE_RC"

      - name: Upload discovery snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arjo-source-discovery
          path: research/discovery/
