name: Evidence Extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/source_registry.csv'
      - 'research/acquisition_manifest.jsonl'
      - 'research/concept_inventory*.jsonl'
      - 'research/concept_terms*.json'
      - 'research/evidence_registry*.jsonl'
      - 'scripts/build_evidence_registry.py'
      - 'scripts/check_evidence_registry.py'
      - 'scripts/evidence_registry_union.py'
      - 'scripts/reconcile_evidence_coverage.py'
      - '.github/workflows/evidence-extraction.yml'

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build atomic base evidence from direct first-party sources
        run: >-
          python scripts/build_evidence_registry.py
          --output /tmp/evidence_registry.jsonl
          --coverage /tmp/evidence_coverage.json
      - name: Validate regenerated base evidence before staging
        run: >-
          python scripts/check_evidence_registry.py
          --evidence /tmp/evidence_registry.jsonl
          --coverage /tmp/evidence_coverage.json
      - name: Stage durable base evidence state
        run: |
          cp /tmp/evidence_registry.jsonl research/evidence_registry.jsonl
          cp /tmp/evidence_coverage.json research/evidence_coverage.json
      - name: Reconcile coverage with additive recovery evidence shards
        run: python scripts/reconcile_evidence_coverage.py
      - name: Validate canonical evidence union after staging
        run: python scripts/check_evidence_registry.py
      - name: Validate repository provenance with generated evidence union
        run: python scripts/check_provenance.py
      - name: Upload bounded evidence state
        uses: actions/upload-artifact@v4
        with:
          name: evidence-registry-state
          path: |
            research/evidence_registry.jsonl
            research/evidence_coverage.json
          retention-days: 30
      - name: Publish bounded evidence branch
        id: branch
        shell: bash
        run: |
          if git diff --quiet -- research/evidence_registry.jsonl research/evidence_coverage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/evidence-registry-${GITHUB_RUN_ID}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add research/evidence_registry.jsonl research/evidence_coverage.json
          git commit -m "research: record atomic first-party evidence registry"
          git push origin "$branch"
      - name: Open reviewed PR, dispatch validation, or create service fallback
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ARJO_AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set +e
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated evidence extraction: publish atomic first-party state" \
            --body "Atomic first-party base evidence extraction completed, additive recovery shards were preserved, and evidence-union coverage/provenance checks passed. No predicate synthesis or performance analysis was performed. Merge only after normal CI, provenance, dependency, and gate checks pass."
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            scripts/dispatch_autonomous_validation.sh "$BRANCH"
            exit 0
          fi

          existing="$(gh issue list --state open --search "$BRANCH in:body" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            exit 0
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- project-meta
          ISSUE_ID: ARJO-AUTO-EVIDENCE-${GITHUB_RUN_ID}
          TYPE: EVIDENCE_EXTRACTION_SERVICE
          DEPENDENCIES: [6]
          ENTRY_GATE: CONCEPT_INVENTORY_READY
          OUTPUT_GATE: NONE
          OWNER: UNCLAIMED
          STATE: READY
          -->

          Atomic first-party base evidence extraction completed, additive recovery shards were preserved, and the deterministic evidence-union coverage/provenance checks passed.

          Service generated branch: ${BRANCH}

          Automation PR credential failed. Open a reviewed PR to main, run normal CI/provenance checks, and merge only if green. No predicate synthesis or performance analysis was performed.
          EOF
          gh issue create --title "Service completed atomic evidence branch" --body-file "$body_file"
