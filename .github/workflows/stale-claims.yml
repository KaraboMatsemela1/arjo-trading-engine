name: Stale Claim Detection

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: read
  issues: read

jobs:
  stale-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect stale claims
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_CLAIM_HOURS: '24'
        run: python scripts/check_stale_claims.py
