name: V2 Causal Validation Protocol

on:
  pull_request:
    paths:
      - research/v2/future_validation_protocol_v2.json
      - scripts/check_v2_causal_validation_protocol.py
      - scripts/test_v2_causal_validation_protocol.py
      - .github/workflows/v2-causal-validation-protocol.yml
  push:
    branches:
      - v2/issue-196-causal-bootstrap-protocol
    paths:
      - research/v2/future_validation_protocol_v2.json
      - scripts/check_v2_causal_validation_protocol.py
      - scripts/test_v2_causal_validation_protocol.py
      - .github/workflows/v2-causal-validation-protocol.yml

permissions:
  contents: read

jobs:
  causal-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile causal protocol tooling
        run: python -m py_compile scripts/check_v2_causal_validation_protocol.py scripts/test_v2_causal_validation_protocol.py
      - name: Validate causal cold-start protocol
        run: PYTHONPATH=scripts python scripts/check_v2_causal_validation_protocol.py --protocol research/v2/future_validation_protocol_v2.json
      - name: Run causal initialization sabotage tests
        run: PYTHONPATH=scripts python scripts/test_v2_causal_validation_protocol.py
      - name: Prove no future data file was introduced
        run: |
          test ! -e research/v2/future-validation-data || exit 1
          echo 'future_market_data_present=false'
