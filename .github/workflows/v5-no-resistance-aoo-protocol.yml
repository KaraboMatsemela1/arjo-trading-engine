name: V5 No-Resistance AoO Protocol

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/profitability/v5_no_resistance_aoo_protocol_v1.json'
      - 'research/profitability/v5_no_resistance_aoo_evidence_boundary_v1.json'
      - 'scripts/check_v5_no_resistance_aoo_protocol.py'
      - 'scripts/test_v5_no_resistance_aoo_protocol.py'
      - '.github/workflows/v5-no-resistance-aoo-protocol.yml'
  push:
    branches:
      - agent/v5-nra-protocol
    paths:
      - 'research/profitability/v5_no_resistance_aoo_protocol_v1.json'
      - 'research/profitability/v5_no_resistance_aoo_evidence_boundary_v1.json'
      - 'scripts/check_v5_no_resistance_aoo_protocol.py'
      - 'scripts/test_v5_no_resistance_aoo_protocol.py'
      - '.github/workflows/v5-no-resistance-aoo-protocol.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable V5 protocol
        run: python scripts/check_v5_no_resistance_aoo_protocol.py
      - name: Run V5 protocol sabotage regressions
        run: PYTHONPATH=scripts python scripts/test_v5_no_resistance_aoo_protocol.py
