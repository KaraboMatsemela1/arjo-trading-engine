name: V8 FVG Follow-Through Economics Preflight

on:
  pull_request:
    paths:
      - 'scripts/v8_fvg_followthrough_backtest_metrics.py'
      - 'scripts/test_v8_fvg_followthrough_backtest.py'
      - 'research/profitability/v8_fvg_followthrough_forward_confirmation_transport_v1.json'
      - '.github/workflows/v8-fvg-followthrough-economics-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen V8 strategy protocol
        run: python scripts/check_v8_fvg_followthrough_protocol.py
      - name: Verify V8 forward transport was frozen before historical economics
        run: |
          python - <<'PY'
          import hashlib
          import json

          p = 'research/profitability/v8_fvg_followthrough_forward_confirmation_transport_v1.json'
          x = json.load(open(p))
          recorded = x.pop('transport_sha256')
          raw = json.dumps(x, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          assert recorded == 'b72b6f8aaaf6c53c6f957917105feba4078cfd6e37c059c49b912cc4203503e8'
          assert hashlib.sha256(raw).hexdigest() == recorded
          assert x['protocol_sha256'] == '79c0289293996f02faa6de1ecb5dcc6d6201a7b98bff1be842bab6cc707b547d'
          assert x['status'] == 'FROZEN_BEFORE_V8_HISTORICAL_M1_RESULT'
          assert x['access_gate']['historical_gate_must_pass_before_forward_structure_access'] is True
          assert x['access_gate']['post_historical_parameter_changes_allowed'] is False
          assert x['access_gate']['post_historical_cost_changes_allowed'] is False
          assert x['access_gate']['post_historical_threshold_changes_allowed'] is False
          assert x['economic_provider']['price'] == 'BA'
          assert x['structure_provider']['granularities'] == ['H4', 'H1']
          assert x['structure_provider']['start_inclusive'] == '2024-01-01T00:00:00Z'
          assert x['structure_provider']['end_exclusive'] == '2026-08-01T00:00:00Z'
          assert x['forward_pass_gate']['minimum_resolved_executed_trades'] == 75
          assert x['forward_pass_gate']['profit_factor_gt'] == 1.2
          assert x['forward_pass_gate']['stress_profit_factor_gt'] == 1.1
          assert x['safety'] == {
              'paper_execution_authorized': False,
              'live_execution_authorized': False,
              'broker_mutation_authorized': False,
          }
          PY
      - name: Compile V8 classifier
        run: python -m py_compile scripts/v8_fvg_followthrough_backtest_metrics.py scripts/test_v8_fvg_followthrough_backtest.py
      - name: Run V8 threshold sabotage tests
        run: PYTHONPATH=scripts python scripts/test_v8_fvg_followthrough_backtest.py
      - name: Re-run shared symmetric fill mechanics tests
        run: PYTHONPATH=scripts python scripts/test_v6_momentum_backtest.py
      - name: Prove V8 M1 lock is absent
        run: test ! -e research/profitability/V8_FVG_FOLLOWTHROUGH_M1_EXECUTE_LOCK.json
