name: New Source Detection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_youtube_sources.py'
      - 'scripts/discover_telegram_sources.py'
      - 'scripts/discover_website_sources.py'
      - 'scripts/build_surface_audit.py'
      - 'scripts/sync_source_roots.py'
      - 'research/source_roots.json'
      - '.github/workflows/new-source-detection.yml'
  schedule:
    - cron: '41 5 * * 0'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery tooling
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Synchronize verified discovery roots
        run: python scripts/sync_source_roots.py

      - name: Enumerate official YouTube surfaces
        id: youtube
        shell: bash
        run: |
          set +e
          python scripts/discover_youtube_sources.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enumerate public first-party Telegram archive
        id: telegram
        shell: bash
        run: |
          set +e
          python scripts/discover_telegram_sources.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Crawl public first-party website surfaces
        id: website
        shell: bash
        run: |
          set +e
          python scripts/discover_website_sources.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build platform surface audit
        run: python scripts/build_surface_audit.py

      - name: Validate generated provenance shape
        run: python scripts/check_provenance.py

      - name: Record hard or partial discovery degradation
        if: steps.youtube.outputs.exit_code != '0' || steps.telegram.outputs.exit_code != '0' || steps.website.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_RC: ${{ steps.youtube.outputs.exit_code }}
          TELEGRAM_RC: ${{ steps.telegram.outputs.exit_code }}
          WEBSITE_RC: ${{ steps.website.outputs.exit_code }}
        shell: bash
        run: |
          existing="$(gh issue list --state open --search 'Source discovery access degradation in:title' --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Source discovery access degradation" \
              --body "<!-- project-meta
          ISSUE_ID: ARJO-AUTO-DISCOVERY-${GITHUB_RUN_ID}
          TYPE: SOURCE_ACCESS_RECOVERY
          DEPENDENCIES: []
          ENTRY_GATE: REPO_CREATED
          OUTPUT_GATE: NONE
          OWNER: UNCLAIMED
          STATE: READY
          -->

          Automated first-party source discovery was not fully clean.

          Exit codes: YouTube=${YOUTUBE_RC}, Telegram=${TELEGRAM_RC}, Website=${WEBSITE_RC}.

          Inspect the committed/generated discovery reports. Do not interpret a transport failure as evidence absence.

          Stop condition: each failed surface either succeeds on replay or receives an explicit terminal external-access classification."
          fi

      - name: Push bounded discovery branch when registry or audit changed
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet -- research/source_registry.csv research/discovery/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source-registry changes detected."
            exit 0
          fi

          branch="automation/source-discovery-${GITHUB_RUN_ID}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add research/source_registry.csv research/discovery/
          git commit -m "research: register newly discovered Arjo sources"
          git push origin "$branch"

      - name: Open bounded source-registry PR or create service fallback
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set +e
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated source discovery: register new Arjo sources" \
            --body "Automated bounded update from confirmed first-party discovery surfaces. No strategy semantics were inferred. Review provenance status and merge only after deterministic validation."
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          echo "PR creation is not authorized for GITHUB_TOKEN; creating a bounded service issue instead."
          existing="$(gh issue list --state open --search "$BRANCH in:body" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Service generated source-discovery branch" \
              --body "<!-- project-meta
          ISSUE_ID: ARJO-AUTO-PR-${GITHUB_RUN_ID}
          TYPE: SOURCE_DISCOVERY_SERVICE
          DEPENDENCIES: []
          ENTRY_GATE: REPO_CREATED
          OUTPUT_GATE: NONE
          OWNER: UNCLAIMED
          STATE: READY
          -->

          GitHub Actions generated and pushed bounded discovery branch \\`${BRANCH}\`, but repository policy does not permit GITHUB_TOKEN to create pull requests.

          Create a PR from \\`${BRANCH}\` to \\`main\`, run deterministic checks, and merge only if green. No semantic interpretation is permitted in this service task."
          fi
