name: Issue 101 Incremental First-Party Discovery

on:
  push:
    branches: [issue-101-incremental-first-party-discovery]
    paths:
      - scripts/build_incremental_discovery_report.py
      - .github/workflows/issue-101-incremental-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install existing discovery tooling
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Prepare isolated registry
        run: |
          mkdir -p /tmp/issue101-discovery
          cp research/source_registry.csv /tmp/issue101-baseline.csv
          cp research/source_registry.csv /tmp/issue101-scanned.csv

      - name: Scan official YouTube surfaces
        id: youtube
        shell: bash
        run: |
          set +e
          python scripts/discover_youtube_sources.py \
            --registry /tmp/issue101-scanned.csv \
            --discovery-dir /tmp/issue101-discovery
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan public first-party Telegram archive
        id: telegram
        shell: bash
        run: |
          set +e
          python scripts/discover_telegram_sources.py \
            --registry /tmp/issue101-scanned.csv \
            --discovery-dir /tmp/issue101-discovery \
            --max-pages 100
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan known first-party website surfaces
        id: website
        shell: bash
        run: |
          set +e
          python scripts/discover_website_sources.py \
            --registry /tmp/issue101-scanned.csv \
            --discovery-dir /tmp/issue101-discovery \
            --max-pages 100
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build isolated incremental delta
        env:
          YOUTUBE_RC: ${{ steps.youtube.outputs.exit_code }}
          TELEGRAM_RC: ${{ steps.telegram.outputs.exit_code }}
          WEBSITE_RC: ${{ steps.website.outputs.exit_code }}
        run: |
          python scripts/build_incremental_discovery_report.py \
            --baseline /tmp/issue101-baseline.csv \
            --scanned /tmp/issue101-scanned.csv \
            --discovery-dir /tmp/issue101-discovery \
            --output /tmp/issue101_incremental_discovery.json \
            --youtube-rc "$YOUTUBE_RC" \
            --telegram-rc "$TELEGRAM_RC" \
            --website-rc "$WEBSITE_RC" \
            --issue 101

      - name: Validate discovery boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/issue101_incremental_discovery.json').read_text())
          assert report['issue'] == 101
          assert report['semantic_closure_performed'] is False
          assert report['search_or_metadata_semantic_credit'] == 'ZERO'
          assert report['baseline_registry_rows'] > 0
          assert report['scanned_registry_rows'] >= report['baseline_registry_rows']
          assert report['new_source_count'] == len(report['new_sources'])
          for row in report['new_sources']:
              assert row['FIRST_PARTY_STATUS'] in {'CONFIRMED_FIRST_PARTY', 'CONFIRMED_FIRST_PARTY_LINKED'}
              assert row['URL'].startswith(('https://', 'http://'))
          print({
              'new_source_count': report['new_source_count'],
              'new_source_counts_by_platform': report['new_source_counts_by_platform'],
              'surface_exit_codes': report['surface_exit_codes'],
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue-101-incremental-first-party-discovery
          path: |
            /tmp/issue101_incremental_discovery.json
            /tmp/issue101-discovery
          retention-days: 14
