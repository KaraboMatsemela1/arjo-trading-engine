name: V7 Candle Science Economics Preflight

on:
  pull_request:
    paths:
      - 'scripts/v7_candle_science_backtest_metrics.py'
      - 'scripts/test_v7_candle_science_backtest.py'
      - 'research/profitability/v7_candle_science_forward_confirmation_transport_v1.json'
      - '.github/workflows/v7-candle-science-economics-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen V7 strategy protocol
        run: python scripts/check_v7_candle_science_protocol.py
      - name: Verify forward transport frozen before V7 historical result
        run: |
          python - <<'PY'
          import hashlib,json
          p='research/profitability/v7_candle_science_forward_confirmation_transport_v1.json'
          x=json.load(open(p));recorded=x.pop('transport_sha256')
          raw=json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          assert recorded=='83bdd46c80acec241499d5d99e76df22b8c11cdf4edd5983b4f4937582fdbc8e'
          assert hashlib.sha256(raw).hexdigest()==recorded
          assert x['protocol_sha256']=='98ed03185f93643e1c1b326835bee169e1f72a84d00c5a6aa4e56453a2a57134'
          assert x['status']=='FROZEN_BEFORE_V7_HISTORICAL_M1_RESULT'
          assert x['access_gate']['historical_gate_must_pass_before_forward_structure_access'] is True
          assert x['access_gate']['post_historical_parameter_changes_allowed'] is False
          assert x['economic_provider']['price']=='BA'
          assert x['structure_provider']['start_inclusive']=='2024-01-01T00:00:00Z'
          assert x['structure_provider']['end_exclusive']=='2026-08-01T00:00:00Z'
          assert x['safety']=={'paper_execution_authorized':False,'live_execution_authorized':False,'broker_mutation_authorized':False}
          PY
      - name: Compile V7 classifier
        run: python -m py_compile scripts/v7_candle_science_backtest_metrics.py scripts/test_v7_candle_science_backtest.py
      - name: Run V7 threshold sabotage tests
        run: PYTHONPATH=scripts python scripts/test_v7_candle_science_backtest.py
      - name: Re-run shared symmetric fill mechanics tests
        run: PYTHONPATH=scripts python scripts/test_v6_momentum_backtest.py
      - name: Prove V7 M1 lock is absent
        run: test ! -e research/profitability/V7_CANDLE_SCIENCE_M1_EXECUTE_LOCK.json
