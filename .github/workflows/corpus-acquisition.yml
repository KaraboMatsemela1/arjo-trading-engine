name: Corpus Acquisition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/source_registry.csv'
      - 'scripts/acquire_corpus.py'
      - 'scripts/acquisition_*.py'
      - 'scripts/check_acquisition_manifest.py'
      - 'scripts/check_corpus_coverage.py'
      - '.github/workflows/corpus-acquisition.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: corpus-acquisition-publication
  cancel-in-progress: false

jobs:
  acquire-delta:
    name: acquire-new-or-nonterminal-sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public acquisition transport
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Show deterministic acquisition delta
        run: >-
          python scripts/acquire_corpus.py
          --skip-terminal-existing
          --plan
      - name: Acquire only missing or non-terminal source IDs
        run: >-
          python scripts/acquire_corpus.py
          --skip-terminal-existing
          --cache-root /tmp/arjo-artifacts
      - name: Validate combined manifest
        run: python scripts/check_acquisition_manifest.py
      - name: Require complete terminal corpus coverage
        run: >-
          python scripts/check_corpus_coverage.py
          --report research/corpus_coverage.json
      - name: Upload combined corpus state
        uses: actions/upload-artifact@v4
        with:
          name: corpus-acquisition-state
          path: |
            research/acquisition_manifest.jsonl
            research/corpus_coverage.json
          retention-days: 30
      - name: Publish bounded corpus-state branch
        id: branch
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if git diff --quiet -- research/acquisition_manifest.jsonl research/corpus_coverage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No durable corpus delta; existing terminal records remain immutable."
            exit 0
          fi
          branch="automation/corpus-acquisition-${GITHUB_RUN_ID}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add research/acquisition_manifest.jsonl research/corpus_coverage.json
          git commit -m "research: record incremental corpus acquisition state"
          git push origin "$branch"
      - name: Open reviewed PR or create service fallback
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ARJO_AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated corpus acquisition: publish incremental state" \
            --body "Bounded incremental corpus-acquisition state generated only for missing or non-terminal first-party source IDs. Existing terminal records are preserved. No strategy semantics were synthesized. Merge only after normal CI, provenance, dependency, and gate checks pass."
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          existing="$(gh issue list --state open --search "$BRANCH in:body" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            exit 0
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- project-meta
          ISSUE_ID: ARJO-AUTO-CORPUS-${GITHUB_RUN_ID}
          TYPE: CORPUS_ACQUISITION_SERVICE
          DEPENDENCIES: [5]
          ENTRY_GATE: ACQUISITION_TOOLING_READY
          OUTPUT_GATE: NONE
          OWNER: UNCLAIMED
          STATE: READY
          -->

          Incremental corpus acquisition completed and passed terminal coverage validation.

          Service generated branch: ${BRANCH}

          Automation PR credential failed. Open a reviewed PR to main, run deterministic CI/provenance checks, and merge only if green. No strategy semantics were synthesized.
          EOF
          gh issue create --title "Service completed incremental corpus-acquisition branch" --body-file "$body_file"
