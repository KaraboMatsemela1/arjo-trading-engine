name: V5 NRA Forward Trigger Preflight

on:
  pull_request:
    paths:
      - 'scripts/v5_nra_confirmation_structure.py'
      - 'scripts/run_v5_nra_forward_trigger_seal.py'
      - '.github/workflows/v5-nra-forward-trigger-preflight.yml'
      - '.github/workflows/v5-nra-forward-trigger-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile forward trigger-seal code
        run: python -m py_compile scripts/v5_nra_confirmation_structure.py scripts/run_v5_nra_forward_trigger_seal.py
      - name: Verify frozen forward confirmation protocol
        run: python scripts/check_v5_nra_forward_confirmation_protocol.py
      - name: Re-run V5 trigger algorithm regressions
        run: PYTHONPATH=scripts python scripts/test_v5_nra_triggers.py
